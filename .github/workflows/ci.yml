name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: Engineering (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node eng/test.mjs
      - run: node eng/guidance.mjs check

  engineering-checks:
    name: Engineering Checks
    needs: engineering
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both operating systems
        env:
          RESULT: ${{ needs.engineering.result }}
        run: test "$RESULT" = success

  full-verification:
    name: Full Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NOVA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NOVA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Nova/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify Docker
        run: docker info
      - name: Build once and verify all suites serially
        run: node eng/verify.mjs run --profile ci --install-browser
      - name: Retain execution and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # Preserve current required contexts until the two-run hosted proof succeeds.
  build:
    name: Build
    needs: full-verification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.full-verification.result }}
        run: test "$RESULT" = success
  unit-tests:
    name: Unit Tests
    needs: full-verification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.full-verification.result }}
        run: test "$RESULT" = success
