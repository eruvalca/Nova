name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nova/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: Nova

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nova.slnx

      - name: Build
        run: dotnet build Nova.slnx --no-restore

      - name: Build Bootstrap theme CSS
        run: npm run build:css
        working-directory: Nova

      - name: Check contrast
        run: npm run check:contrast
        working-directory: Nova

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nova/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: Nova

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nova.slnx

      - name: Test
        run: dotnet test --project Nova.Unit.Tests/Nova.Unit.Tests.csproj --no-restore
