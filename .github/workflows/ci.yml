name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nova/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: Nova

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nova.slnx

      - name: Build
        # `dotnet build` itself triggers the BuildBootstrapTheme MSBuild target, which
        # compiles the Sass into wwwroot/css/bootstrap-theme.css. The step above (npm ci)
        # already installed node_modules per package-lock.json, so the target's npm ci guard
        # is skipped and the CSS is compiled exactly once here. A separate `npm run build:css`
        # step would compile the CSS a redundant second time, so we rely on the build and only
        # run the contrast check next.
        run: dotnet build Nova.slnx --no-restore

      - name: Check contrast
        run: npm run check:contrast
        working-directory: Nova

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nova/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: Nova

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nova.slnx

      - name: Test
        run: dotnet test --project Nova.Unit.Tests/Nova.Unit.Tests.csproj --no-restore
