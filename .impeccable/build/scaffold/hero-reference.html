<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: issue-197-side-context.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f3f7f5}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-nav region chrome" data-region="nav"><!-- Established navigation rail with brand, navigation links and account controls --></div>
  <div class="r-back region text" data-region="back"><!-- Back to campaigns --><p style="font-size:var(--r-back-font);line-height:1.05;margin:0">back</p></div>
  <div class="r-campaign-title region text" data-region="campaign-title"><!-- Fall evaluation --><p style="font-size:var(--r-campaign-title-font);font-family:var(--r-campaign-title-family),sans-serif;font-weight:var(--r-campaign-title-weight);line-height:1.05;margin:0">campaign-title</p></div>
  <div class="r-campaign-facts region text" data-region="campaign-facts"><!-- Season, written Active status, dates and participant scale --><p style="font-size:var(--r-campaign-facts-font);line-height:1.05;margin:0">campaign-facts</p></div>
  <div class="r-route region chrome" data-region="route"><!-- Four connected circular route links and full labels --></div>
  <div class="r-readiness region text" data-region="readiness"><!-- Needs placement and missing local outcome counts --><p style="font-size:var(--r-readiness-font);line-height:1.05;margin:0">readiness</p></div>
  <div class="r-readiness-link region control" data-region="readiness-link"><!-- Review readiness link: rebuild the control's chrome from the crop (comp-spec.mjs --crop readiness-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-search region control" data-region="search"><!-- Search by name or tryout number: rebuild the control's chrome from the crop (comp-spec.mjs --crop search); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-filters-toggle region control" data-region="filters-toggle"><!-- Filters toggle: rebuild the control's chrome from the crop (comp-spec.mjs --crop filters-toggle); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-filter-shelf region control" data-region="filter-shelf"><!-- Five labeled filter controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop filter-shelf); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-table-header region chrome" data-region="table-header"><!-- Sortable participant, local outcome and effective placement headings --></div>
  <div class="r-roster-row-1 region chrome" data-region="roster-row-1"><!-- Participant initials, name, number/year, tags, local outcome and effective source --></div>
  <div class="r-roster-row-2 region chrome" data-region="roster-row-2"><!-- Participant initials, name, number/year, tags, local outcome and effective source --></div>
  <div class="r-roster-row-3 region chrome" data-region="roster-row-3"><!-- Participant initials, name, number/year, tags, local outcome and effective source --></div>
  <div class="r-roster-row-4 region chrome" data-region="roster-row-4"><!-- Participant initials, name, number/year, tags, local outcome and effective source --></div>
  <div class="r-roster-row-5 region chrome" data-region="roster-row-5"><!-- Participant initials, name, number/year, tags, local outcome and effective source --></div>
  <div class="r-roster-row-6 region chrome" data-region="roster-row-6"><!-- Participant initials, name, number/year, tags, local outcome and effective source --></div>
  <div class="r-pager region control" data-region="pager"><!-- Result count and page navigation: rebuild the control's chrome from the crop (comp-spec.mjs --crop pager); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-participant-title region text" data-region="participant-title"><!-- Avery Morgan and participant identity --><p style="font-size:var(--r-participant-title-font);line-height:1.05;margin:0">participant-title</p></div>
  <div class="r-participant-nav region control" data-region="participant-nav"><!-- Previous and next participant navigation: rebuild the control's chrome from the crop (comp-spec.mjs --crop participant-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-participant-close region control" data-region="participant-close"><!-- Close participant context: rebuild the control's chrome from the crop (comp-spec.mjs --crop participant-close); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-local-decision region text" data-region="local-decision"><!-- Campaign outcome: No campaign decision --><p style="font-size:var(--r-local-decision-font);line-height:1.05;margin:0">local-decision</p></div>
  <div class="r-effective-decision region text" data-region="effective-decision"><!-- Effective placement, source campaign and optional reassignment --><p style="font-size:var(--r-effective-decision-font);line-height:1.05;margin:0">effective-decision</p></div>
  <div class="r-notes region text" data-region="notes"><!-- Notes heading, author, time and observation --><p style="font-size:var(--r-notes-font);line-height:1.05;margin:0">notes</p></div>
  <div class="r-add-note region control" data-region="add-note"><!-- Add note action: rebuild the control's chrome from the crop (comp-spec.mjs --crop add-note); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-tags region text" data-region="tags"><!-- Tags heading and applied trait --><p style="font-size:var(--r-tags-font);line-height:1.05;margin:0">tags</p></div>
  <div class="r-apply-tag region control" data-region="apply-tag"><!-- Apply tag action: rebuild the control's chrome from the crop (comp-spec.mjs --crop apply-tag); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-identity-region region chrome" data-region="identity-region"><!-- Campaign identity field --></div>
  <div class="r-search-region region chrome" data-region="search-region"><!-- White search toolbar --></div>
  <div class="r-context-board region chrome" data-region="context-board"><!-- White participant context board with hairline border --></div>
</main>
</body>
</html>
